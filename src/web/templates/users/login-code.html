{% extends "base.html" %}

{% block content %}
<h1>Verificar código</h1>
<form action="{{ url_for('auth.login_code') }}" method="POST">
    <label for="code">Código:</label>
    <input type="text" name="code" maxlength="6" minlength="6" required>
    <button class="btn btn-info btn-sm" type="submit">Verificar</button>
</form>
{% endblock %}
