{% extends "base_register.html" %}

{% block title %}{% if is_update %}Actualizar Usuario{% else %}Registro{% endif %}{% endblock %}

{% block form_fields %}
<label for="email">Email:</label>
<input type="email" name="email" value="{{ user.email if is_update else '' }}" {% if is_update %}disabled{% endif %} required>

<label for="password">Contraseña:</label>
<input type="password" name="password" {% if is_update %}placeholder="Dejar vacío para no cambiar"{% endif %} required>

<label for="fecha_nacimiento">Fecha de nacimiento:</label>
<input type="text" name="fecha_nacimiento" value="{{ user.fecha_nacimiento if is_update else '' }}" {% if is_update %}disabled{% endif %} required>

<label for="nombre">Nombre:</label>
<input type="text" name="nombre" value="{{ user.nombre if is_update else '' }}" required>

<label for="apellido">Apellido:</label>
<input type="text" name="apellido" value="{{ user.apellido if is_update else '' }}" required>

<label for="telefono">Teléfono (opcional):</label>
<input type="tel" name="telefono" value="{{ user.telefono if is_update else '' }}">
{% endblock %}
