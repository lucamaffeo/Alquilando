{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 40vh;">
    <div class="w-100" style="max-width: 600px;">
        <form action="{{ url_for('usuarios.login') }}" method="POST" class="p-5 rounded border border-main shadow-sm bg-white">
            <h1 class="mb-4 text-center" style="font-size:2.5rem; text-decoration: underline;"><strong>Iniciar Sesión</strong></h1>
            <div class="mb-4">
                <input type="email" name="email" class="form-control border-main" style="font-size:1.1rem; height:48px;" placeholder="Ingrese el email" required>
            </div>
            <div class="mb-4">
                <input type="password" name="password" class="form-control border-main" style="font-size:1.1rem; height:48px;" placeholder="Ingrese la contraseña" required>
            </div>
            <input type="hidden" name="role" value="user">
            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-main btn-sm px-3 py-2" style="font-size:0.95rem; min-width:110px;">Iniciar
                    Sesión</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
