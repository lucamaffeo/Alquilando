{% extends "estadisticas/layout.html" %}

{% block estadisticas_content %}
<h2>Alquileres por Sucursal</h2>

<form method="POST" class="row g-3 mb-4">
  <div class="col-md-5">
    <label for="fecha_inicio" class="form-label">Fecha de inicio</label>
    <input type="date" name="fecha_inicio" class="form-control" required>
  </div>
  <div class="col-md-5">
    <label for="fecha_fin" class="form-label">Fecha de fin</label>
    <input type="date" name="fecha_fin" class="form-control" required>
  </div>
  <div class="col-md-2 align-self-end">
    <button type="submit" class="btn btn-primary w-100">Buscar</button>
  </div>
</form>

<!-- Gráfico de torta -->
<div class="grafico-container">
  <canvas id="graficoTorta"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById("graficoTorta").getContext("2d");

  let labels = {{ sucursales | tojson }};
  let data = {{ alquileres | tojson }};
  let baseColors = ['#007bff', '#28a745', '#ffc107', '#dc3545', '#17a2b8', '#6c757d', '#6610f2', '#fd7e14', '#20c997', '#e83e8c'];
  let backgroundColors = labels.map((_, i) => baseColors[i % baseColors.length]);

  // Si no hay ningún alquiler (suma 0), mostrar la torta vacía en gris
  if (data.length === 0 || data.reduce((a, b) => a + b, 0) === 0) {
    data = labels.map(() => 1);
    backgroundColors = labels.map(() => 'black');
  }

  const chart = new Chart(ctx, {
    type: "pie",
    data: {
      labels: labels,
      datasets: [{
        label: "Alquileres por Sucursal",
        data: data,
        backgroundColor: backgroundColors
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
</script>

{% if alquileres|length == 0 or alquileres|sum == 0 %}
  <div class="alert alert-info mt-3">No se registraron alquileres en las fechas seleccionadas, pero se muestran todas las sucursales.</div>
{% endif %}

<style>
  .grafico-container {
    position: relative;
    width: 100%;
    max-width: 300px;
    margin: auto;
    aspect-ratio: 1;
  }

  #graficoTorta {
    width: 100% !important;
    height: auto !important;
  }
</style>

{% endblock %}
