{% extends "estadisticas/layout.html" %}

{% block estadisticas_content %}
<h2>Alquileres por Sucursal</h2>

<form method="POST" class="row g-3 mb-4">
  <div class="col-md-5">
    <label for="fecha_inicio" class="form-label">Fecha de inicio</label>
    <input type="date" name="fecha_inicio" class="form-control" required>
  </div>
  <div class="col-md-5">
    <label for="fecha_fin" class="form-label">Fecha de fin</label>
    <input type="date" name="fecha_fin" class="form-control" required>
  </div>
  <div class="col-md-2 align-self-end">
    <button type="submit" class="btn btn-primary w-100">Buscar</button>
  </div>
</form>

<!-- Gráfico de torta -->
<div class="grafico-container">
  <canvas id="graficoTorta"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById("graficoTorta").getContext("2d");

  // Si alquileres tiene todos ceros, mostramos un único valor 'Sin datos' para que no falle
  let labels = {{ sucursales | tojson }};
  let data = {{ alquileres | tojson }};
  let backgroundColors = ['#007bff', '#28a745', '#ffc107', '#dc3545', '#17a2b8'];

  // Si no hay ningún alquiler (suma 0), mostrar sólo las sucursales con datos en cero
  if (data.reduce((a, b) => a + b, 0) === 0) {
    data = labels.map(() => 1); // Le ponemos 1 a cada sucursal solo para que se vea el gráfico
    backgroundColors = labels.map(() => '#d3d3d3'); // Color gris claro
  }

  const chart = new Chart(ctx, {
    type: "pie",
    data: {
      labels: labels,
      datasets: [{
        label: "Alquileres por Sucursal",
        data: data,
        backgroundColor: backgroundColors
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
</script>

{% if alquileres|sum == 0 %}
  <div class="alert alert-info mt-3">No se registraron alquileres en las fechas seleccionadas, pero se muestran las sucursales.</div>
{% endif %}


<style>
  .grafico-container {
    position: relative;
    width: 100%;
    max-width: 300px;
    margin: auto;
    aspect-ratio: 1;
  }

  #graficoTorta {
    width: 100% !important;
    height: auto !important;
  }
</style>
{% endblock %}
