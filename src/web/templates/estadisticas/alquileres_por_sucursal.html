{% extends "estadisticas/layout.html" %} {% block estadisticas_content %}
<h2>Alquileres por Sucursal</h2>

<form method="POST" class="row g-3 mb-4">
  <div class="col-md-5">
    <label for="fecha_inicio" class="form-label">Fecha de inicio</label>
    <input
      type="date"
      name="fecha_inicio"
      id="fecha_inicio"
      class="form-control"
      value="{{ fecha_inicio }}"
      required
    />
  </div>
  <div class="col-md-5">
    <label for="fecha_fin" class="form-label">Fecha de fin</label>
    <input
      type="date"
      name="fecha_fin"
      id="fecha_fin"
      class="form-control"
      value="{{ fecha_fin }}"
      min="{{ fecha_inicio }}"
      required
    />
  </div>
  <div class="col-md-2 align-self-end">
    <button type="submit" class="btn btn-primary w-100">Buscar</button>
  </div>
</form>

<!-- Gráfico de torta -->
<div class="grafico-container">
  <canvas id="graficoTorta"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const ctx = document.getElementById("graficoTorta").getContext("2d");

  let labels = {{ sucursales | tojson }};
  let data = {{ alquileres | tojson }};
  let baseColors = [
    '#007bff', '#28a745', '#ffc107', '#dc3545', '#17a2b8',
    '#6c757d', '#6610f2', '#fd7e14', '#20c997', '#e83e8c',
    '#b02a37', '#198754', '#0dcaf0', '#adb5bd', '#f8f9fa'
  ];
  let backgroundColors = labels.map((_, i) => baseColors[i % baseColors.length]);

  // Si no hay ningún alquiler (suma 0), mostrar una torta vacía (un solo sector gris claro)
  if (data.length === 0 || data.reduce((a, b) => a + b, 0) === 0) {
    labels = ["Sin reservas"];
    data = [1];
    backgroundColors = ['black'];
  }

  const chart = new Chart(ctx, {
    type: "pie",
    data: {
      labels: labels,
      datasets: [{
        label: "Alquileres por Sucursal",
        data: data,
        backgroundColor: backgroundColors
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true
        },
        tooltip: {
          callbacks: {
            label: function(context) {
              // Si es la torta vacía, no mostrar valor
              if (labels.length === 1 && labels[0] === "Sin reservas") {
                return "Sin reservas en el rango seleccionado";
              }
              return context.label + ': ' + context.parsed;
            }
          }
        }
      }
    }
  });
</script>

<script>
  // Sincroniza fecha de fin con fecha de inicio
  document.addEventListener("DOMContentLoaded", function() {
    const fechaInicio = document.getElementById("fecha_inicio");
    const fechaFin = document.getElementById("fecha_fin");
    if (fechaInicio && fechaFin) {
      fechaInicio.addEventListener("change", function() {
        fechaFin.min = fechaInicio.value;
        if (fechaFin.value && fechaFin.value < fechaInicio.value) {
          fechaFin.value = fechaInicio.value;
        }
      });
    }
  });
</script>

<style>
  .grafico-container {
    position: relative;
    width: 100%;
    max-width: 300px;
    margin: auto;
    aspect-ratio: 1;
  }

  #graficoTorta {
    width: 100% !important;
    height: auto !important;
  }
</style>
{% endblock %}
