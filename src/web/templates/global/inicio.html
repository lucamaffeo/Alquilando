{% extends "base.html" %}

{% block content %}
<h1 class="titulo-principal mb-4">Busque una reserva</h1>
<div class="d-flex justify-content-center">
    <form action="{{ url_for('vehiculos.disponibles') }}" method="POST" class="bg-white p-4 rounded shadow-sm border border-main d-flex flex-column gap-3" style="max-width:500px; min-width:320px;">
        <div>
            <label for="sucursal" class="form-label" style="font-weight:600;">Sucursal:</label>
            <select name="sucursal" id="sucursal" class="form-select border-main" required>
                <option value="" disabled selected>Seleccione una sucursal</option>
                {% for sucursal in sucursales %}
                <option value="{{ sucursal.id }}">{{ sucursal.nombre }} - {{ sucursal.ubicacion }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="fecha_inicio" class="form-label" style="font-weight:600;">Fecha Inicio:</label>
            <input type="date" name="fecha_inicio" id="fecha_inicio" class="form-control border-main" required min="{{ (now().date() + timedelta(days=1)).isoformat() }}">
        </div>
        <div>
            <label for="fecha_fin" class="form-label" style="font-weight:600;">Fecha Fin:</label>
            <input type="date" name="fecha_fin" id="fecha_fin" class="form-control border-main" required min="{{ (now().date() + timedelta(days=1)).isoformat() }}">
        </div>
        <div class="text-center mt-2">
            <button type="submit" class="btn btn-main px-4" style="font-size:1.08rem;">
                <i class="bi bi-search"></i> Buscar
            </button>
        </div>
    </form>
</div>
<script>
    // JS para que la fecha fin no pueda ser menor a la fecha inicio
    document.addEventListener('DOMContentLoaded', function() {
        var fechaInicio = document.getElementById('fecha_inicio');
        var fechaFin = document.getElementById('fecha_fin');
        fechaInicio.addEventListener('change', function() {
            fechaFin.min = fechaInicio.value;
        });
    });
</script>
{% endblock %}
