{% extends "base_register.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="w-100" style="max-width: 500px;">
        <h1 class="mb-4 text-center titulo-principal">
            {% if is_update %}Actualizar Adicional{% else %}Registrar Adicional{% endif %}
        </h1>
        <form method="POST" class="p-4 rounded border border-main shadow-sm bg-white mx-auto">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control" name="nombre" id="nombre" value="{{ adicional.nombre if adicional else '' }}" required>
            </div>
            <div class="mb-3">
                <label for="precio" class="form-label">Precio:</label>
                <input type="number" class="form-control" name="precio" id="precio" min="0" value="{{ adicional.precio if adicional else '' }}" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-main px-4">
                    {% if is_update %}Actualizar{% else %}Registrar{% endif %}
                </button>
                <a href="{{ url_for('adicionales.index') }}" class="btn btn-secondary ms-2">Volver</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
