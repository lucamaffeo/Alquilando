{% extends "base_register.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="w-100" style="max-width: 600px;">
        <h1 class="mb-4 text-center titulo-principal">Registrar Sucursal</h1>
        <form method="POST" class="p-4 rounded border border-main shadow-sm bg-white mx-auto">
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre:</label>
                <input type="text" class="form-control border-main" name="nombre" required>
            </div>
            <div class="mb-3">
                <label for="ubicacion" class="form-label">Ubicación:</label>
                <input type="text" class="form-control border-main" name="ubicacion" required>
            </div>
            <div class="text-center">
                <button type="submit" class="btn btn-main px-4">
                    <i class="bi bi-check-circle"></i> Registrar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
