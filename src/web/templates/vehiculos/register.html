{% extends "base_register.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="w-100" style="max-width: 1000px;">
        <h1 class="mb-4 text-center titulo-principal">{% if is_update %}Actualizar Vehículo{% else %}Registrar Vehículo{% endif %}</h1>
        <form method="POST" enctype="multipart/form-data" class="p-4 rounded border border-main shadow-sm bg-white mx-auto">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10">
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label for="patente" class="form-label">Patente:</label>
                            <input type="text" class="form-control border-main" placeholder="Ingrese la patente sin espacios" minlength="6" maxlength="7" name="patente" value="{{ vehiculo.patente if is_update else '' }}" {% if is_update %}disabled{% endif %} required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="modelo" class="form-label">Modelo:</label>
                            <input type="text" class="form-control border-main" name="modelo" value="{{ vehiculo.modelo_nombre() if is_update else '' }}" required pattern="[A-ZÁÉÍÓÚÑ][a-zA-ZáéíóúÁÉÍÓÚñÑ0-9\s\-]*" title="El modelo debe comenzar con mayúscula">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="marca" class="form-label">Marca:</label>
                            <input type="text" class="form-control border-main" name="marca" value="{{ vehiculo.marca if is_update else '' }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="anio" class="form-label">Año:</label>
                            <input type="number" class="form-control border-main" name="anio" value="{{ vehiculo.anio if is_update else '' }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="precio" class="form-label">Precio:</label>
                            <input type="number" class="form-control border-main" name="precio" value="{{ vehiculo.precio if is_update else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="categoria" class="form-label">Categoría:</label>
                            <input type="text" class="form-control border-main" name="categoria" value="{{ vehiculo.categoria if is_update else '' }}" required>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="asientos" class="form-label">Asientos:</label>
                            <input type="number" class="form-control border-main" max="13" min="2" name="asientos" value="{{ vehiculo.asientos if is_update else '' }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="imagen" class="form-label">Imagen:</label>
                            <input type="file" class="form-control border-main" name="imagen" value="{{ vehiculo.imagen if is_update else '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="sucursal_id" class="form-label">Sucursal:</label>
                            <select name="sucursal_id" class="form-select border-main" required>
                                <option value="" disabled {% if not is_update %}selected{% endif %}>Seleccione una sucursal</option>
                                {% for s in sucursales %}
                                    <option value="{{ s.id }}" {% if is_update and vehiculo.sucursal_id == s.id %}selected{% endif %}>
                                        {{ s.nombre }} - {{ s.ubicacion }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="politica_cancelacion" class="form-label">Política de Cancelación:</label>
                            <select class="form-select border-main" name="politica_cancelacion">
                                <option value="Reembolso completo"
                                    {% if is_update and vehiculo.modelo_rel and vehiculo.modelo_rel.politica_cancelacion == "reembolso completo" %}selected{% endif %}>
                                    Reembolso completo
                                </option>
                                <option value="Reembolso parcial"
                                    {% if is_update and vehiculo.modelo_rel and vehiculo.modelo_rel.politica_cancelacion == "reembolso parcial" %}selected{% endif %}>
                                    Reembolso parcial
                                </option>
                                <option value="Sin reembolso"
                                    {% if is_update and (vehiculo.modelo_rel is none or vehiculo.modelo_rel.politica_cancelacion == "Sin reembolso") %}selected{% endif %}>
                                    Sin reembolso
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-12 text-center">
                    <button type="submit" class="btn btn-main px-4">{% if is_update %}Actualizar{% else %}Guardar{% endif %}</button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
